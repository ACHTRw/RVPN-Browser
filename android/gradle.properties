# Gradle settings for the RVPN Browser Android front-end.
#
# 2 GB is enough for a single-module app; the JVM default (512 MB) is not.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# AndroidX is mandatory (androidx.webkit.ProxyController drives the per-app
# proxy override, which the platform WebView API cannot do).
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Do not fail the build because of a warning-level lint finding.
android.lint.abortOnError=false
